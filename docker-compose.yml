version: '3.8'

services:

  postgres:
    image: postgres:16

    container_name: cliente_postgres

    restart: always

    environment:
      POSTGRES_DB: prova_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: agape123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - cliente_network

  backend:
    build: ./api

    container_name: cliente_backend

    restart: always

    ports:
      - "8080:8080"

    depends_on:
      - postgres

    networks:
      - cliente_network

  frontend:
    build: ./app

    container_name: cliente_frontend

    restart: always

    ports:
      - "5173:5173"

    depends_on:
      - backend

    networks:
      - cliente_network

networks:
  cliente_network:
    driver: bridge

volumes:
  postgres_data: